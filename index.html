<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
     <div class="container">
        <h1>GradeBook</h1>
        <p>Student Result Management System</p>
    

     <h2>Student Information</h2>

     <label for="studentName">Student Name</lebel>
     <input type="text" id="studentName" placeholder="Enter student name">
     
     <label for="rollNumber">Roll Number</lebel>
     <input type="number" id="rollNumber" placeholder="Enter roll number">

     <h2>Subject Information</h2>

     <label for="subject1">Subject 1 Name</lebel>
     <input type="text" id="subject1" placeholder="Enter subject name">

     <label for="marks 1">subject 1 marks</lebel>
     <input type="number" id="marks1" placeholder="Enter marks">

     <label for="subject2">Subject 2 Name</label>
     <input type="text" id="subject2" placeholder="Enter subject name">

     <label for="marks2">Subject 2 Marks</label>
     <input type="number" id="marks2" placeholder="Enter marks">

     <label for="subject3">Subject 3 Name</label>
     <input type="text" id="subject3" placeholder="Enter subject name">

     <label for="marks3">Subject 3 Marks</label>
     <input type="number" id="marks3" placeholder="Enter marks">

     <label for="subject4">Subject 4 Name</label>
     <input type="text" id="subject4" placeholder="Enter subject name">

     <label for="marks4">Subject 4 Marks</label>
     <input type="number" id="marks4" placeholder="Enter marks">

     <label for="subject5">Subject 5 Name</label>
     <input type="text" id="subject5" placeholder="Enter subject name">

     <label for="marks5">Subject 5 Marks</label>
     <input type="number" id="marks5" placeholder="Enter marks">

     <button id="calculateBtn">Calculate Result</button>
      
     <hr>

     <div id="result">
        
     <h2>Result</h2>

     <p><strong>Total Marks:</strong> <span id="totalMarks">0</span></p>

     <p><strong>Average:</strong> <span id="average">0</span></p>

     <p><strong>Percentage:</strong> <span id="percentage">0</span>%</p>

     <p><strong>Grade:</strong> <span id="grade">F</span></p>

     <p><strong>Status:</strong> <span id="status">-</span></p>

    </div>
      </div>
 
      <script src="script.js"></script>
    </body>
</html>
